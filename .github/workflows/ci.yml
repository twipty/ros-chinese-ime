# RosPinyin - Simplified Chinese pinyin IME for ReactOS
# SPDX-License-Identifier: MIT
# See LICENSE and NOTICE.txt at the repository root.
name: CI

on:
  push:
    branches: [main]
    # Tag pushes build and then publish the release from the same artifacts.
    # Pushing the tag is the whole release act; there is no manual upload step
    # left that could attach a binary built from something other than the tag.
    tags: ['alpha*', 'beta*', 'v*']
  pull_request:
  workflow_dispatch:

jobs:
  engine-smoke:
    name: Engine tests + M1 contract (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IME source syntax check (host Win32 ABI stub)
        # Verifies the Win32 host + UI layers, the assembly glue and the
        # installer compile syntactically without needing MinGW: no linking,
        # no Windows SDK, no binary output.
        run: >-
          g++ -std=c++17 -fsyntax-only
          -Itools/syntax_stub -Iframework/include -Iframework/platform/win32/imm32
          -Iframework/platform/win32/ui -Ipinyin/include -Iime -Isamples/toy-scheme
          framework/platform/win32/imm32/dllmain.cpp framework/platform/win32/imm32/imm_entry.cpp
          framework/platform/win32/imm32/key_translate.cpp framework/platform/win32/imm32/trace_line.cpp
          framework/platform/win32/imm32/win32_host.cpp
          framework/platform/win32/imm32/ui_server.cpp framework/platform/win32/imm32/session_store.cpp
          pinyin/host/dat_source_win.cpp
          framework/platform/win32/ui/ime_ui.cpp framework/platform/win32/ui/ui_window.cpp
          framework/platform/win32/ui/composition_window.cpp framework/platform/win32/ui/candidate_window.cpp
          framework/platform/win32/ui/toolbar.cpp ime/scheme_reg.cpp
          ime/scheme_reg_toy.cpp samples/toy-scheme/toy_scheme.cpp
          tools/install-rospinyin/install.cpp
      # CMakePresets.json is the single source of build configuration
      # (X2-e3, audit A-P1-6). Repeating the flags here is how build-win ended
      # up with tests OFF while build-win-trace-en had them ON.
      - name: Configure
        run: cmake --preset linux-ci
      - name: Build
        run: cmake --build --preset linux-ci --parallel
      - name: Test
        run: ctest --preset linux-ci
      - name: Build rospinyin.dat from pinned sources
        # Same sha256-verified inputs the VM data plan documents; the dat is
        # published with the binaries so guestOS can wget it from the share.
        run: bash tools/mkdat/build_dat.sh build/m2-data
      - name: Upload M2 data asset
        uses: actions/upload-artifact@v4
        with:
          name: rospinyin-m2-data
          path: build/m2-data/rospinyin.dat
          if-no-files-found: error
          retention-days: 30
      - name: First-page coverage of the top 500 characters (M2 exit criterion)
        # ROADMAP's M2 exit criterion asks for >= 95% of the 500 most frequent
        # characters to be reachable without paging. Nothing measured it until
        # 2026-11-18 (measured: 96.8%, i.e. 1.8 points of margin). The step is a
        # regression guard: dropping the frequency table or reordering the
        # candidate list would show up here as a red build.
        run: >-
          python3 tools/coverage_report.py
          --dat build/m2-data/rospinyin.dat
          --top 500 --fail-under 95

      - name: Documentation layout (docs/ is the only home for prose)
        # The 2026-11-18 reorganisation moved 16 markdown files out of the root.
        # Without a gate the next report lands next to README.md again and
        # nobody notices, so the layout itself is now a contract: root holds no
        # markdown but README.md, every file under docs/ is listed in its index,
        # and every relative link resolves.
        run: python3 tools/check_docs.py

  windows-build:
    # MinGW-w64 i686, NOT MSVC. MSVC's CRT statically imports
    # kernel32!InitializeCriticalSectionEx, which ReactOS 0.4.16 does not
    # export (its spec2def gates that API behind -version=0x600+ while the
    # default build version is 0x502). MinGW's CRT uses the legacy
    # InitializeCriticalSection, and -static removes every non-system DLL
    # dependency. The verify step below makes any regression a hard failure.
    name: MinGW i686 / ReactOS targets (rospinyin.ime + CLI + GUI installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: >-
            mingw-w64-i686-binutils
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
      - name: Decode tray icon from base64
        # push_files only carries text, so the 16x16 ICO is committed as
        # base64 and restored here before windres compiles rospinyin_res.rc.
        shell: msys2 {0}
        run: tr -d '\r' < ime/rospinyin.ico.b64 | base64 -d > ime/rospinyin.ico
      # Three configurations, one definition each: CMakePresets.json (X2-e3).
      # The preset names below are asserted by tools/check_m1.py, so a rename
      # here fails the Linux job instead of quietly testing nothing.
      - name: Configure (standalone)
        shell: msys2 {0}
        run: cmake --preset win32-mingw
      - name: Configure (in-tree target)
        shell: msys2 {0}
        run: cmake --preset win32-intree
      - name: Configure (toy scheme)
        # X2-a0's standing proof: a *second* scheme assembles from the same
        # framework by switching one option. If this job disappears, the "add a
        # folder, not a framework patch" claim stops being tested anywhere.
        shell: msys2 {0}
        run: cmake --preset win32-toy
      - name: Build (standalone)
        shell: msys2 {0}
        run: cmake --build --preset win32-mingw --parallel
      - name: Build (in-tree target)
        shell: msys2 {0}
        run: cmake --build --preset win32-intree --parallel
      - name: Build (toy scheme)
        shell: msys2 {0}
        run: cmake --build --preset win32-toy --parallel
      - name: Verify PE imports (ReactOS 0.4.16 compatibility)
        shell: msys2 {0}
        run: |
          set -eu
          IME=$(find build-standalone -type f -name rospinyin.ime | head -n 1)
          TOY=$(find build-toy -type f -name rospinyin.ime | head -n 1)
          EXE=$(find build-standalone -type f -name install-rospinyin.exe | head -n 1)
          GUI=$(find build-standalone -type f -name install-rospinyin-gui.exe | head -n 1)
          RHASH=$(find build-standalone -type f -name rhash.exe | head -n 1)
          WGET=$(find build-standalone -type f -name wget.exe | head -n 1)
          CURL=$(find build-standalone -type f -name curl.exe | head -n 1)
          test -n "$IME" && test -n "$TOY" && test -n "$EXE" && test -n "$GUI"
          test -n "$RHASH" && test -n "$WGET" && test -n "$CURL"
          echo "IME=$IME"
          echo "TOY=$TOY"
          echo "EXE=$EXE"
          echo "GUI=$GUI"
          echo "RHASH=$RHASH"
          echo "WGET=$WGET"
          echo "CURL=$CURL"
          # A toy build that came out byte-identical to the product build means
          # ROSPINYIN_SCHEME was ignored: one of the two branches silently did
          # the other one's work.
          if cmp -s "$IME" "$TOY"; then
            echo "FATAL: -DROSPINYIN_SCHEME=toy produced the pinyin binary"
            exit 1
          fi
          for f in "$IME" "$TOY" "$EXE" "$GUI" "$RHASH" "$WGET" "$CURL"; do
            echo "===== imports of $f ====="
            objdump -p "$f" | sed -n '/The Import Tables/,$p'
            if objdump -p "$f" | grep -Eqi 'InitializeCriticalSectionEx'; then
              echo "FATAL: $f imports Vista+ kernel32!InitializeCriticalSectionEx"
              exit 1
            fi
            if objdump -p "$f" | grep -Eqi 'vcruntime140|api-ms-win-crt|libstdc\+\+-6|libgcc_s|libwinpthread'; then
              echo "FATAL: $f depends on a runtime DLL absent from bare ReactOS"
              exit 1
            fi
          done
      - name: Stage VM test assets
        # Flat layout for the ReactOS test VM: wget from the host HTTP share
        # expects bare filenames next to the installer.
        shell: msys2 {0}
        run: |
          set -eu
          IME=$(find build-standalone -type f -name rospinyin.ime | head -n 1)
          EXE=$(find build-standalone -type f -name install-rospinyin.exe | head -n 1)
          GUI=$(find build-standalone -type f -name install-rospinyin-gui.exe | head -n 1)
          RHASH=$(find build-standalone -type f -name rhash.exe | head -n 1)
          WGET=$(find build-standalone -type f -name wget.exe | head -n 1)
          CURL=$(find build-standalone -type f -name curl.exe | head -n 1)
          mkdir -p stage
          cp "$IME" stage/rospinyin.ime
          cp "$EXE" stage/install-rospinyin.exe
          cp "$GUI" stage/install-rospinyin-gui.exe
          cp "$RHASH" stage/rhash.exe
          cp "$WGET" stage/wget.exe
          cp "$CURL" stage/curl.exe
          ls -l stage
      - name: Upload VM test assets
        uses: actions/upload-artifact@v4
        with:
          name: rospinyin-m1-win32
          path: stage/
          if-no-files-found: error
          retention-days: 30

  publish-artifacts-branch:
    # The sandbox has no GitHub token for artifact download, so CI commits
    # the binaries to a dedicated branch; the VM test loop reads them back
    # through the repository contents API. GITHUB_TOKEN pushes do not
    # retrigger workflows, so this cannot loop.
    name: Publish VM test binaries (m1-artifacts branch)
    runs-on: ubuntu-latest
    needs: windows-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # Full history: the shallow default (depth 1) made git operations that
      # switch onto origin/m1-artifacts fail intermittently (exit 128).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rospinyin-m1-win32
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: rospinyin-m2-data
          path: m2-stage
      - name: Verify IME tray icon resource
        # ReactOS kbswitch only paints a layout icon for IME layouts when the
        # .ime carries an RT_GROUP_ICON resource; otherwise the tray stays
        # blank. Guard against a future build dropping the icon back out.
        run: |
          set -eu
          RD=$(command -v llvm-readobj || command -v llvm-readobj-18 || command -v llvm-readobj-17 || true)
          if [ -z "$RD" ]; then
            echo "llvm-readobj unavailable; skipping icon resource check"
            exit 0
          fi
          echo "using $RD"
          "$RD" --coff-resources stage/rospinyin.ime | grep -qi 'ICON' || {
            echo "FATAL: rospinyin.ime has no RT_GROUP_ICON resource (tray icon would be blank)"
            exit 1
          }
          echo "OK: rospinyin.ime carries an icon resource"
      - name: Commit binaries to m1-artifacts branch
        run: |
          git config user.name "twipty"
          git config user.email "82503737+twipty@users.noreply.github.com"
          mkdir -p /tmp/binaries
          cp -f stage/rospinyin.ime stage/install-rospinyin.exe \
                stage/rhash.exe stage/wget.exe stage/curl.exe \
                m2-stage/rospinyin.dat /tmp/binaries/
          if git ls-remote --exit-code origin m1-artifacts >/dev/null 2>&1; then
            git fetch origin m1-artifacts
            git checkout -B m1-artifacts origin/m1-artifacts
          else
            git checkout --orphan m1-artifacts
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
          fi
          cp -f /tmp/binaries/rospinyin.ime /tmp/binaries/install-rospinyin.exe \
                /tmp/binaries/rhash.exe /tmp/binaries/wget.exe \
                /tmp/binaries/curl.exe /tmp/binaries/rospinyin.dat .
          printf 'source commit: %s\nbuilt: %s\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > INFO.txt
          git add -f rospinyin.ime install-rospinyin.exe rhash.exe wget.exe \
                    curl.exe rospinyin.dat INFO.txt
          git commit -m "M2 Win32 binaries + data from ${GITHUB_SHA::7}" || echo "no changes"
          # Force push: this branch is a binary drop zone, newest run wins.
          # Also removes non-fast-forward failures from concurrent runs.
          git push --force origin m1-artifacts

  release:
    # P2-1: pushing the tag *is* the release. The assets are the artifacts this
    # very run produced, so "the published binary is the build of this tag" is
    # enforced instead of remembered -- alpha0.0.2 shipped from a local build
    # with the version resource still saying alpha0.0.1, and nothing noticed.
    #
    # The version gate compares three things: the tag name, ime/version.h, and
    # FILEVERSION inside the built .ime. Bump ime/version.h in the commit you
    # tag, and write docs/releases/<tag>.md before tagging (the gate requires it).
    name: Publish release assets (tag)
    runs-on: ubuntu-latest
    needs: [engine-smoke, windows-build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rospinyin-m1-win32
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: rospinyin-m2-data
          path: m2-stage
      - name: Version gate (tag == version.h == FILEVERSION of the artifact)
        run: python3 tools/check_release_version.py "$TAG" --binary stage/rospinyin.ime
      - name: Assemble assets
        run: |
          set -eu
          mkdir -p out
          cp stage/rospinyin.ime stage/install-rospinyin.exe \
             stage/install-rospinyin-gui.exe stage/rhash.exe \
             m2-stage/rospinyin.dat out/
          # M4: the word list is mandatory and is not stored in git as a
          # binary. Restore it byte-for-byte from the checked-in generated
          # payload header; the script pins size + SHA-256 before writing.
          python3 tools/mklex/extract_payload.py --output out/rospinyin-lexicon.dat
          printf 'tag: %s\nsource commit: %s\nworkflow run: %s\n' \
            "$TAG" "$GITHUB_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > out/INFO.txt
          cd out
          sha256sum rospinyin.ime rospinyin.dat rospinyin-lexicon.dat \
            install-rospinyin.exe install-rospinyin-gui.exe rhash.exe INFO.txt \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish
        # Re-runs are idempotent: an existing release gets its notes refreshed
        # and its assets replaced with --clobber.
        run: |
          set -eu
          NOTES="docs/releases/${TAG}.md"
          PRE=""
          # alpha*/beta* are prereleases; v* is the formal release line.
          case "$TAG" in alpha* | beta*) PRE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" $PRE
          else
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$NOTES" $PRE
          fi
          gh release upload "$TAG" out/* --clobber
      - name: Verify the public assets byte-for-byte
        # The same check that was done by hand for alpha0.0.2 (three files
        # downloaded back through gh-proxy and compared). Automating it means a
        # truncated upload can no longer be discovered by a user.
        run: |
          set -eu
          gh release download "$TAG" --dir verify --clobber
          cd verify && sha256sum -c SHA256SUMS.txt
