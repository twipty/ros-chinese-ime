# RosPinyin - Simplified Chinese pinyin IME for ReactOS
# SPDX-License-Identifier: MIT
# See LICENSE and NOTICE.txt at the repository root.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-smoke:
    name: Engine tests + M1 contract (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IME source syntax check (host Win32 ABI stub)
        # Verifies ime/*.cpp and the installer compile syntactically without
        # needing MinGW: no linking, no Windows SDK, no binary output.
        run: >-
          g++ -std=c++17 -fsyntax-only
          -Itools/syntax_stub -Iengine/include
          ime/dllmain.cpp ime/imm_entry.cpp ime/ui_server.cpp
          tools/install-rospinyin/install.cpp
      - name: Configure
        run: cmake -S . -B build -DROSPINYIN_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-build:
    name: Windows/ReactOS targets (rospinyin.ime + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (standalone)
        run: cmake -S . -B build-standalone -A Win32
      - name: Configure (in-tree target)
        run: cmake -S . -B build-intree -A Win32 -DROSPINYIN_IN_TREE=ON
      - name: Build (standalone)
        run: cmake --build build-standalone --config Release --parallel
      - name: Build (in-tree target)
        run: cmake --build build-intree --config Release --parallel
      - name: Verify artefact names
        run: |
          $f = Get-ChildItem -Recurse -Filter "rospinyin.ime" build-standalone
          if (-not $f) { throw "rospinyin.ime was not produced" }
          $f | Select-Object -ExpandProperty FullName
          $exe = Get-ChildItem -Recurse -Filter "install-rospinyin.exe" build-standalone
          if (-not $exe) { throw "install-rospinyin.exe was not produced" }
          $exe | Select-Object -ExpandProperty FullName
        shell: pwsh
      - name: Stage VM test assets
        # Flat layout for the ReactOS test VM: wget from the host HTTP share
        # expects bare filenames next to the installer.
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item (Get-ChildItem -Recurse -Filter "rospinyin.ime" build-standalone).FullName stage\rospinyin.ime
          Copy-Item (Get-ChildItem -Recurse -Filter "install-rospinyin.exe" build-standalone).FullName stage\install-rospinyin.exe
          Get-ChildItem stage
        shell: pwsh
      - name: Upload VM test assets
        uses: actions/upload-artifact@v4
        with:
          name: rospinyin-m1-win32
          path: stage/
          if-no-files-found: error
          retention-days: 30

  publish-artifacts-branch:
    # The sandbox has no GitHub token for artifact download, so CI commits
    # the binaries to a dedicated branch; the VM test loop reads them back
    # through the repository contents API. GITHUB_TOKEN pushes do not
    # retrigger workflows, so this cannot loop.
    name: Publish VM test binaries (m1-artifacts branch)
    runs-on: ubuntu-latest
    needs: windows-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # Full history: the shallow default (depth 1) made git operations that
      # switch onto origin/m1-artifacts fail intermittently (exit 128).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rospinyin-m1-win32
          path: stage
      - name: Commit binaries to m1-artifacts branch
        run: |
          git config user.name "twipty"
          git config user.email "82503737+twipty@users.noreply.github.com"
          mkdir -p /tmp/binaries
          cp -f stage/rospinyin.ime stage/install-rospinyin.exe /tmp/binaries/
          if git ls-remote --exit-code origin m1-artifacts >/dev/null 2>&1; then
            git fetch origin m1-artifacts
            git checkout -B m1-artifacts origin/m1-artifacts
          else
            git checkout --orphan m1-artifacts
            git rm -rf --cached . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
          fi
          cp -f /tmp/binaries/rospinyin.ime /tmp/binaries/install-rospinyin.exe .
          printf 'source commit: %s\nbuilt: %s\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > INFO.txt
          git add -f rospinyin.ime install-rospinyin.exe INFO.txt
          git commit -m "M1 Win32 binaries from ${GITHUB_SHA::7}" || echo "no changes"
          # Force push: this branch is a binary drop zone, newest run wins.
          # Also removes non-fast-forward failures from concurrent runs.
          git push --force origin m1-artifacts
